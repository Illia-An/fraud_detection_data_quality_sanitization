services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: fraud-dq-sanitization:local
    container_name: fraud-dq
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - path: .env.docker
        required: false
    environment:
      SANITIZATION_SOURCE: ${SANITIZATION_SOURCE:-snapshot}
      SNAPSHOT_URL: ${SNAPSHOT_URL:-sqlite:///data/q10012_snapshot.sqlite}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-http://localhost:8000}
      FRONTEND_DIST_DIR: /app/web/dist
    volumes:
      # Host snapshot (gitignored). Create via scripts/refresh_q10012_snapshot.py
      - ./data/q10012_snapshot.sqlite:/app/data/q10012_snapshot.sqlite:ro
    restart: unless-stopped
