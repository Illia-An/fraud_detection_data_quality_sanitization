services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: fraud-dq-sanitization:local
    container_name: fraud-dq
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - path: .env.docker
        required: false
    environment:
      SANITIZATION_SOURCE: ${SANITIZATION_SOURCE:-snapshot}
      SNAPSHOT_URL: ${SNAPSHOT_URL:-sqlite:///data/q10012_snapshot.sqlite}
      TTS_KPI_SOURCE: ${TTS_KPI_SOURCE:-snapshot}
      TTS_KPI_SNAPSHOT_URL: ${TTS_KPI_SNAPSHOT_URL:-sqlite:///data/tts_kpi_snapshot.sqlite}
      PLAN_STORE_PATH: ${PLAN_STORE_PATH:-/app/data/plan_store/plans.sqlite}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-http://localhost:8000}
      FRONTEND_DIST_DIR: /app/web/dist
    volumes:
      # Mount data/ dir (Wave 2 / D-02) so atomic *.tmp → replace + *.prev work on host.
      # Snapshots stay read-only in the container; refresh runs on the host.
      - ./data:/app/data:ro
      # Baseline Plan versions (SPEC-P001) — read/write overlay on the data mount
      - ./data/plan_store:/app/data/plan_store
    restart: unless-stopped
