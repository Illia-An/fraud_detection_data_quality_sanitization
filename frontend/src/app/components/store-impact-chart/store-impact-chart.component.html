<mat-card class="chart-card">
  <mat-card-header>
    <mat-card-title>Store 5%: actual vs sanitized</mat-card-title>
    <mat-card-subtitle>
      Toggle Tier 1/2/3 and click Run — the chart shows the impact of each filter
    </mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    @if (storeIds.length) {
      <mat-form-field appearance="outline" class="store-select">
        <mat-label>Store (PrintStore)</mat-label>
        <mat-select
          [value]="selectedStoreId"
          (selectionChange)="onStoreChange($event.value)"
        >
          @for (id of storeIds; track id) {
            <mat-option [value]="id">Store {{ id }}</mat-option>
          }
        </mat-select>
      </mat-form-field>

      <div class="charts">
        <div class="chart-wrap line-chart">
          <canvas #lineCanvas></canvas>
        </div>
        <div class="chart-wrap bar-chart">
          <canvas #barCanvas></canvas>
        </div>
      </div>
    } @else {
      <p class="empty">No store×month data available for the chart.</p>
    }
  </mat-card-content>
</mat-card>
