[project]
name = "fraud-detection-data-quality-sanitization"
version = "0.1.0"
description = "Fraud detection data quality / sanitization — FastAPI + SQL Server baseline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "sqlalchemy>=2.0.51",
    "pyodbc>=5.3.0",
    "python-dotenv>=1.2.2",
    "pandas>=2.3.2",
    "httpx>=0.28.0",
    "pydantic>=2.0.0",
    "scikit-learn>=1.5.0",
    "openpyxl>=3.1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "jupyter>=1.1.1",
    "ipykernel>=6.29.0",
    "matplotlib>=3.8.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/fraud_guard",
    "src/schemas",
    "src/planner",
    "src/excel_report",
    "src/tts_kitchen",
    "backend",
    "db",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Wave 8 / M-14 — start with a focused rule set; expand later.
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "backend", "db", "tests"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "silent"
files = ["src/planner"]
